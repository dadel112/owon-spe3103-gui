<!-- @dsCard group="Components" viewport="700x230" name="Feedback — dialog, tooltip" subtitle="Modal message box variants and the yellow balloon" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Feedback</title><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--grey-300);padding:12px;font:var(--type-body)}#root{display:block}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.cap{font:var(--weight-normal) var(--text-pixel-sm)/1 var(--font-pixel);letter-spacing:var(--tracking-pixel);color:var(--grey-700);margin:0 0 6px}</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../_dev_fallback.js" data-root="../.."></script>
<script type="text/babel">
const NS="Bench95DesignSystem_3e1c29";
let Dialog,Tooltip,Button,IconButton;

function Card(){
  return (<div style={{display:"flex",gap:14,alignItems:"flex-start",flexWrap:"wrap"}}>
    <Dialog kind="warning" title="Bench95" width={300} message="Output is still enabled." detail="Disable the output before disconnecting the load." buttons={["OK","Cancel"]}/>
    <Dialog kind="error" title="Connection failed" width={300} message="No response from COM3." detail="Check the cable and the baud rate, then retry." buttons={["Retry","Cancel"]} defaultButton="Retry"/>
    <div style={{paddingTop:24,display:"flex",flexDirection:"column",gap:16}}>
      <p className="cap" style={{margin:0}}>TOOLTIP — hover the buttons</p>
      <div className="row" style={{margin:0}}>
        <Tooltip text="Save profile (Ctrl+S)"><IconButton icon="save" label="Save"/></Tooltip>
        <Tooltip text="Clear log" side="right"><IconButton icon="trash" label="Clear"/></Tooltip>
      </div>
      <span style={{whiteSpace:"nowrap",background:"#ffffe1",font:"var(--type-label)",padding:"1px 4px 2px",boxShadow:"var(--bevel-outline)",alignSelf:"flex-start"}}>Save profile (Ctrl+S)</span>
    </div>
  </div>);
}
(function boot(){
  const ds=window[NS];
  if(!ds) return setTimeout(boot,40);
  ({Dialog, Tooltip, Button, IconButton} = ds);
  ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
})();
</script></body></html>
