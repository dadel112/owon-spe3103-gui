<!-- @dsCard group="Components" viewport="700x260" name="Forms — fields, spinner, select, checks, trackbar" subtitle="Sunken wells, 21px controls, 3-decimal setpoints" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Forms</title><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--grey-300);padding:12px;font:var(--type-body)}#root{display:block}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.cap{font:var(--weight-normal) var(--text-pixel-sm)/1 var(--font-pixel);letter-spacing:var(--tracking-pixel);color:var(--grey-700);margin:0 0 6px}</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../_dev_fallback.js" data-root="../.."></script>
<script type="text/babel">
const NS="Bench95DesignSystem_3e1c29";
let TextField,NumberSpinner,Select,Checkbox,Radio,Slider,Panel;

function Card(){
  const [v,setV]=React.useState(12.000),[a,setA]=React.useState(1.250),[p,setP]=React.useState("COM3");
  const [ovp,setOvp]=React.useState(true),[beep,setBeep]=React.useState(false),[mode,setMode]=React.useState("cv");
  const [s,setS]=React.useState(12);
  return (<div style={{display:"flex",gap:16,alignItems:"flex-start"}}>
    <div style={{width:300}}>
      <p className="cap">SETPOINTS</p>
      <div className="row"><span style={{width:56}}>Voltage</span><NumberSpinner value={v} onChange={setV} step={0.1} max={30} decimals={3} unit="V"/></div>
      <div className="row"><span style={{width:56}}>Current</span><NumberSpinner value={a} onChange={setA} step={0.01} max={5} decimals={3} unit="A"/></div>
      <div className="row"><span style={{width:56}}>Disabled</span><NumberSpinner value={0} decimals={3} unit="A" disabled/></div>
      <p className="cap">TEXT FIELD — mono / plain / disabled</p>
      <div className="row"><TextField value="VOLT 12.000" mono width={130}/><TextField value="Bench profile" width={120}/></div>
      <div className="row"><TextField value="read only" disabled width={130}/><Select value={p} options={["COM1","COM3","/dev/ttyUSB0"]} onChange={setP} width={120}/></div>
    </div>
    <div style={{width:330}}>
      <p className="cap">TRACKBAR</p>
      <div className="row"><Slider value={s} min={0} max={30} step={0.1} ticks={7} onChange={setS} width={200}/><span style={{fontFamily:"var(--font-mono)",fontSize:13}}>{s.toFixed(1)} V</span></div>
      <div style={{display:"flex",gap:10}}>
        <Panel label="Protection" style={{flex:1}}>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <Checkbox checked={ovp} onChange={setOvp} label="OVP"/>
            <Checkbox checked={beep} onChange={setBeep} label="Beep on trip"/>
            <Checkbox checked={false} disabled label="Remote sense"/>
          </div>
        </Panel>
        <Panel label="Mode" style={{flex:1}}>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <Radio name="m" checked={mode==="cv"} onChange={()=>setMode("cv")} label="Constant V"/>
            <Radio name="m" checked={mode==="cc"} onChange={()=>setMode("cc")} label="Constant I"/>
            <Radio name="m" checked={false} disabled label="List mode"/>
          </div>
        </Panel>
      </div>
    </div>
  </div>);
}
(function boot(){
  const ds=window[NS];
  if(!ds) return setTimeout(boot,40);
  ({TextField, NumberSpinner, Select, Checkbox, Radio, Slider, Panel} = ds);
  ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
})();
</script></body></html>
