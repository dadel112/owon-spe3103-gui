<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
.tile{width:100%;height:100%;display:flex}
.main{flex:1;background:var(--navy-900);display:grid;place-items:center;overflow:hidden}
.mark{font-family:var(--font-pixel);font-size:7.5vw;line-height:1;letter-spacing:.04em;color:var(--grey-white);white-space:nowrap}
.strip{width:24%;display:flex;flex-direction:column}
.strip span{flex:1;display:block}
</style></head><body>
<div class="tile">
<div class="main"><span class="mark">BENCH95</span></div>
<div class="strip">
<span style="background:var(--led-green)"></span>
<span style="background:var(--led-amber)"></span>
<span style="background:var(--blue-500)"></span>
<span style="background:var(--desktop-teal)"></span>
</div>
</div>
</body></html>
