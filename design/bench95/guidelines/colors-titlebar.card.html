<!-- @dsCard group="Colors" viewport="700x150" name="Title bar blues" subtitle="Classic navy→blue, XP vertical blue, inactive grey" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:12px;background:var(--grey-300);font:var(--type-body)}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sw{width:104px}
.chip{height:44px;box-shadow:var(--bevel-out-thin)}
.n{display:block;font:var(--weight-normal) var(--text-2xs)/1.4 var(--font-ui);color:var(--grey-700);margin-top:3px;white-space:nowrap}
.v{display:block;font:var(--weight-normal) var(--text-xs)/1.4 var(--font-mono);color:var(--black)}

</style></head><body>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="height:26px;background:var(--gradient-titlebar)"></div>
<div style="height:26px;background:var(--gradient-titlebar-xp)"></div>
<div style="height:26px;background:var(--gradient-titlebar-inactive)"></div>
</div><div class="row"><div class="sw"><div class="chip" style="background:#000080"></div><span class="n">navy 900</span><span class="v">--navy-900</span></div><div class="sw"><div class="chip" style="background:#0054e3"></div><span class="n">blue 600</span><span class="v">--blue-600</span></div><div class="sw"><div class="chip" style="background:#1084d0"></div><span class="n">blue 500</span><span class="v">--blue-500</span></div><div class="sw"><div class="chip" style="background:#3a93ff"></div><span class="n">blue 400</span><span class="v">--blue-400</span></div><div class="sw"><div class="chip" style="background:#a6caf0"></div><span class="n">blue 200</span><span class="v">--blue-200</span></div></div>
</body></html>
