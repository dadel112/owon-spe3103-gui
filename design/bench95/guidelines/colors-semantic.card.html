<!-- @dsCard group="Colors" viewport="700x120" name="Status colours" subtitle="Where the UI states an outcome in colour" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:12px;background:var(--grey-300);font:var(--type-body)}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sw{width:104px}
.chip{height:44px;box-shadow:var(--bevel-out-thin)}
.n{display:block;font:var(--weight-normal) var(--text-2xs)/1.4 var(--font-ui);color:var(--grey-700);margin-top:3px;white-space:nowrap}
.v{display:block;font:var(--weight-normal) var(--text-xs)/1.4 var(--font-mono);color:var(--black)}

</style></head><body>
<div class="row"><div class="sw"><div class="chip" style="background:#008000"></div><span class="n">ok</span><span class="v">--status-ok</span></div><div class="sw"><div class="chip" style="background:#ffb000"></div><span class="n">warn</span><span class="v">--status-warn</span></div><div class="sw"><div class="chip" style="background:#c00000"></div><span class="n">danger</span><span class="v">--status-danger</span></div><div class="sw"><div class="chip" style="background:#000080"></div><span class="n">info</span><span class="v">--status-info</span></div><div class="sw"><div class="chip" style="background:#000080"></div><span class="n">selection</span><span class="v">--surface-selected</span></div><div class="sw"><div class="chip" style="background:#808080"></div><span class="n">disabled text</span><span class="v">--text-disabled</span></div></div>
</body></html>
