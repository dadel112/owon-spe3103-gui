<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:12px;background:var(--grey-300);font:var(--type-body)}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sw{width:104px}
.chip{height:44px;box-shadow:var(--bevel-out-thin)}
.n{display:block;font:var(--weight-normal) var(--text-2xs)/1.4 var(--font-ui);color:var(--grey-700);margin-top:3px;white-space:nowrap}
.v{display:block;font:var(--weight-normal) var(--text-xs)/1.4 var(--font-mono);color:var(--black)}

</style></head><body>
<div style="width:340px;background:var(--surface-dialog);box-shadow:var(--bevel-out);padding:2px">
  <div style="height:18px;background:var(--gradient-titlebar);color:#fff;font:var(--type-titlebar);display:flex;align-items:center;padding:0 4px">Limits</div>
  <div style="padding:11px">
    <div style="box-shadow:var(--bevel-out-thin);padding:8px;display:flex;gap:6px;align-items:center">
      <span style="font:var(--type-label)">Voltage</span>
      <span style="height:21px;flex:1;background:#fff;box-shadow:var(--bevel-in)"></span>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:11px">
      <span style="width:75px;height:23px;background:var(--surface-window);box-shadow:var(--bevel-out);outline:1px solid #000"></span>
      <span style="width:75px;height:23px;background:var(--surface-window);box-shadow:var(--bevel-out)"></span>
    </div>
  </div>
</div>
</body></html>
