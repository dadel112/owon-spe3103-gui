<!-- @dsCard group="Bevels" viewport="700x150" name="Sunken — in / thin / outline" subtitle="Content wells, etched frames, the hard 1px keyline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:12px;background:var(--grey-300);font:var(--type-body)}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sw{width:104px}
.chip{height:44px;box-shadow:var(--bevel-out-thin)}
.n{display:block;font:var(--weight-normal) var(--text-2xs)/1.4 var(--font-ui);color:var(--grey-700);margin-top:3px;white-space:nowrap}
.v{display:block;font:var(--weight-normal) var(--text-xs)/1.4 var(--font-mono);color:var(--black)}

</style></head><body>
<div class="row" style="align-items:center;gap:16px">
<div style="width:120px;height:44px;background:var(--surface-field);box-shadow:var(--bevel-in)"></div>
<div style="width:120px;height:44px;box-shadow:var(--bevel-in-thin)"></div>
<div style="width:120px;height:44px;background:var(--surface-field);box-shadow:var(--bevel-outline)"></div>
</div>
<div class="row"><span class="v" style="width:136px">--bevel-in</span><span class="v" style="width:136px">--bevel-in-thin</span><span class="v">--bevel-outline</span></div>
</body></html>
