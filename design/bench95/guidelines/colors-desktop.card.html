<!-- @dsCard group="Colors" viewport="700x150" name="Desktop backdrops" subtitle="Teal default, classic blue, and the sky/grass gradient" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:12px;background:var(--grey-300);font:var(--type-body)}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sw{width:104px}
.chip{height:44px;box-shadow:var(--bevel-out-thin)}
.n{display:block;font:var(--weight-normal) var(--text-2xs)/1.4 var(--font-ui);color:var(--grey-700);margin-top:3px;white-space:nowrap}
.v{display:block;font:var(--weight-normal) var(--text-xs)/1.4 var(--font-mono);color:var(--black)}

</style></head><body>
<div class="row">
<div style="width:180px;height:88px;background:var(--desktop-teal);box-shadow:var(--bevel-in-thin)"></div>
<div style="width:180px;height:88px;background:var(--desktop-blue);box-shadow:var(--bevel-in-thin)"></div>
<div style="width:260px;height:88px;background:var(--gradient-hill);box-shadow:var(--bevel-in-thin)"></div>
</div>
<div class="row"><span class="v" style="width:180px">--desktop-teal #008080</span><span class="v" style="width:180px">--desktop-blue #3a6ea5</span><span class="v">--gradient-hill</span></div>
</body></html>
