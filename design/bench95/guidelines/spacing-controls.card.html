<!-- @dsCard group="Spacing" viewport="700x160" name="Control heights" subtitle="Real era pixel metrics: 18 / 21 / 23 / 26 tall, 75px min button" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:12px;background:var(--grey-300);font:var(--type-body)}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sw{width:104px}
.chip{height:44px;box-shadow:var(--bevel-out-thin)}
.n{display:block;font:var(--weight-normal) var(--text-2xs)/1.4 var(--font-ui);color:var(--grey-700);margin-top:3px;white-space:nowrap}
.v{display:block;font:var(--weight-normal) var(--text-xs)/1.4 var(--font-mono);color:var(--black)}

</style></head><body>
<div class="row" style="align-items:flex-end;gap:14px">
<div style="text-align:center"><div style="width:64px;height:18px;background:var(--surface-window);box-shadow:var(--bevel-out)"></div><span class="n">18px</span><span class="v">--control-h-sm</span></div><div style="text-align:center"><div style="width:64px;height:21px;background:var(--surface-window);box-shadow:var(--bevel-out)"></div><span class="n">21px</span><span class="v">--control-h</span></div><div style="text-align:center"><div style="width:64px;height:23px;background:var(--surface-window);box-shadow:var(--bevel-out)"></div><span class="n">23px</span><span class="v">--control-h-btn</span></div><div style="text-align:center"><div style="width:64px;height:26px;background:var(--surface-window);box-shadow:var(--bevel-out)"></div><span class="n">26px</span><span class="v">--control-h-lg</span></div><div style="text-align:center"><div style="width:64px;height:18px;background:var(--surface-window);box-shadow:var(--bevel-out)"></div><span class="n">18px</span><span class="v">--titlebar-h</span></div><div style="text-align:center"><div style="width:64px;height:19px;background:var(--surface-window);box-shadow:var(--bevel-out)"></div><span class="n">19px</span><span class="v">--menubar-h</span></div><div style="text-align:center"><div style="width:64px;height:20px;background:var(--surface-window);box-shadow:var(--bevel-out)"></div><span class="n">20px</span><span class="v">--statusbar-h</span></div><div style="text-align:center"><div style="width:64px;height:28px;background:var(--surface-window);box-shadow:var(--bevel-out)"></div><span class="n">28px</span><span class="v">--taskbar-h</span></div>
</div>
</body></html>
