<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing scale" subtitle="1px grid: bevels at 1–2, control gaps at 4–6, gutters at 8–11" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:12px;background:var(--grey-300);font:var(--type-body)}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sw{width:104px}
.chip{height:44px;box-shadow:var(--bevel-out-thin)}
.n{display:block;font:var(--weight-normal) var(--text-2xs)/1.4 var(--font-ui);color:var(--grey-700);margin-top:3px;white-space:nowrap}
.v{display:block;font:var(--weight-normal) var(--text-xs)/1.4 var(--font-mono);color:var(--black)}

</style></head><body>
<div style="display:flex;align-items:flex-end;gap:14px">
<div style="text-align:center"><div style="width:1px;height:3px;background:var(--navy-900)"></div><span class="n">1</span></div><div style="text-align:center"><div style="width:2px;height:6px;background:var(--navy-900)"></div><span class="n">2</span></div><div style="text-align:center"><div style="width:3px;height:9px;background:var(--navy-900)"></div><span class="n">3</span></div><div style="text-align:center"><div style="width:4px;height:12px;background:var(--navy-900)"></div><span class="n">4</span></div><div style="text-align:center"><div style="width:6px;height:18px;background:var(--navy-900)"></div><span class="n">6</span></div><div style="text-align:center"><div style="width:8px;height:24px;background:var(--navy-900)"></div><span class="n">8</span></div><div style="text-align:center"><div style="width:11px;height:33px;background:var(--navy-900)"></div><span class="n">11</span></div><div style="text-align:center"><div style="width:16px;height:48px;background:var(--navy-900)"></div><span class="n">16</span></div><div style="text-align:center"><div style="width:24px;height:72px;background:var(--navy-900)"></div><span class="n">24</span></div>
</div>
<span class="v" style="margin-top:8px">--space-1 … --space-24 · never rounded to a 4px grid</span>
</body></html>
