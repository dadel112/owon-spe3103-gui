<!-- @dsCard group="Colors" viewport="700x120" name="Chrome greys" subtitle="The widget face and its four bevel edges" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:12px;background:var(--grey-300);font:var(--type-body)}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sw{width:104px}
.chip{height:44px;box-shadow:var(--bevel-out-thin)}
.n{display:block;font:var(--weight-normal) var(--text-2xs)/1.4 var(--font-ui);color:var(--grey-700);margin-top:3px;white-space:nowrap}
.v{display:block;font:var(--weight-normal) var(--text-xs)/1.4 var(--font-mono);color:var(--black)}

</style></head><body>
<div class="row"><div class="sw"><div class="chip" style="background:#ffffff"></div><span class="n">white</span><span class="v">--grey-white</span></div><div class="sw"><div class="chip" style="background:#dfdfdf"></div><span class="n">100</span><span class="v">--grey-100</span></div><div class="sw"><div class="chip" style="background:#d4d0c8"></div><span class="n">200 dialog</span><span class="v">--grey-200</span></div><div class="sw"><div class="chip" style="background:#c0c0c0"></div><span class="n">300 face</span><span class="v">--grey-300</span></div><div class="sw"><div class="chip" style="background:#808080"></div><span class="n">500 shadow</span><span class="v">--grey-500</span></div><div class="sw"><div class="chip" style="background:#000000"></div><span class="n">black</span><span class="v">--black</span></div></div>
</body></html>
