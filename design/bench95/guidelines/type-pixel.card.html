<!-- @dsCard group="Type" viewport="700x150" name="Pixel face — Silkscreen" subtitle="Captions inside readouts, spec labels, product wordmark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:12px;background:var(--grey-300);font:var(--type-body)}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sw{width:104px}
.chip{height:44px;box-shadow:var(--bevel-out-thin)}
.n{display:block;font:var(--weight-normal) var(--text-2xs)/1.4 var(--font-ui);color:var(--grey-700);margin-top:3px;white-space:nowrap}
.v{display:block;font:var(--weight-normal) var(--text-xs)/1.4 var(--font-mono);color:var(--black)}

</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
<span style="font:var(--weight-normal) 16px/1 var(--font-pixel);letter-spacing:var(--tracking-pixel)">BENCH95 SUPPLY</span>
<span style="font:var(--weight-normal) 10px/1 var(--font-pixel);letter-spacing:var(--tracking-pixel)">OUTPUT VOLTAGE · 0123456789</span>
<span style="font:var(--weight-normal) 8px/1 var(--font-pixel);letter-spacing:var(--tracking-pixel)">VOLTS AMPS WATTS — 8PX CAPTION</span>
<span class="v">--font-pixel · --text-pixel-lg / --text-pixel-md / --text-pixel-sm</span>
</div>
</body></html>
